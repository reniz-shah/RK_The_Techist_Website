name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main          # Trigger on every push to main
  workflow_dispatch:  # Allow manual one-click deploys from the Actions tab

permissions:
  contents: write     # Required to push to the gh-pages branch

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ──────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Inject secrets as env vars for the build ────────────────────────
      #       EmailJS keys are stored in GitHub → Settings → Secrets & Variables
      #       → Actions → Repository secrets. Add each key listed below.
      - name: Build production bundle
        env:
          VITE_BASE_URL: /RK_The_Techist_Website
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_FOUNDER_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_FOUNDER_TEMPLATE_ID }}
          VITE_EMAILJS_CLIENT_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_CLIENT_TEMPLATE_ID }}
        run: npm run build

      # ── 5. Deploy dist/ → gh-pages branch ─────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true        # Keeps gh-pages history clean (single commit)
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'ci: deploy ${{ github.sha }}'
